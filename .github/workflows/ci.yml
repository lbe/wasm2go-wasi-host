name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM2GO_VERSION: v0.4.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The wasi-testsuite submodule has no Go files; skip fetching it.
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  cross-compile:
    # Cheap portability check: build and vet for platforms without a test runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, windows]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        # wasi.File.Seek returns wasi.Errno (wazero's convention), which the
        # stdmethods check flags because it is not io.Seeker's signature.
        run: go vet -stdmethods=false ./...

  test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            runs-on: ubuntu-latest
          - id: macos
            runs-on: macos-latest
          - id: linux-arm
            runs-on: ubuntu-24.04-arm
          - id: windows
            runs-on: windows-latest
    steps:
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure caches
        id: caches
        shell: bash
        run: |
          echo "testsuite=$(git rev-parse HEAD:wasi-testsuite)" >> "$GITHUB_OUTPUT"
          echo "GOBIN=$RUNNER_TEMP/gobin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
          echo "WASM2GO_RUN_CACHE_DIR=$RUNNER_TEMP/wasm2go-run" >> "$GITHUB_ENV"

      - name: Cache wasm2go binary
        id: wasm2go-bin
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gobin
          key: wasm2go-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM2GO_VERSION }}-${{ hashFiles('go.mod') }}

      # Tier-1 wasm2go-run cache: transpiled Go for each testsuite binary. Its
      # entries are keyed by wasm content and wasm2go identity, so they only
      # change with the submodule pin or the wasm2go version. The tier-2
      # (compiled runner) cache depends on host source and is not kept.
      - name: Cache transpiled testsuite modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wasm2go-run/transpile
          key: wasm2go-transpile-${{ runner.os }}-${{ env.WASM2GO_VERSION }}-${{ steps.caches.outputs.testsuite }}

      - name: Install wasm2go
        if: steps.wasm2go-bin.outputs.cache-hit != 'true'
        run: go install github.com/ncruces/wasm2go@${{ env.WASM2GO_VERSION }}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -tags=e2e ./... -timeout 15m

  # No GitHub-hosted FreeBSD runner exists, so the suite runs in a FreeBSD VM
  # under QEMU on a Linux runner (vmactions/freebsd-vm). The Go toolchain,
  # module cache, build cache, wasm2go and the transpile cache live in
  # .ci-cache inside the workspace, which is synced into the VM, copied back
  # afterwards, and saved with actions/cache.
  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve versions
        id: ver
        run: |
          echo "go=$(awk '$1 == "go" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"
          echo "testsuite=$(git rev-parse HEAD:wasi-testsuite)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeBSD toolchain and build caches
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: freebsd-go${{ steps.ver.outputs.go }}-${{ env.WASM2GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.ver.outputs.testsuite }}-${{ github.sha }}
          restore-keys: |
            freebsd-go${{ steps.ver.outputs.go }}-${{ env.WASM2GO_VERSION }}-${{ hashFiles('go.sum') }}-${{ steps.ver.outputs.testsuite }}-
            freebsd-go${{ steps.ver.outputs.go }}-${{ env.WASM2GO_VERSION }}-

      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1.6.0
        env:
          GO_VERSION: ${{ steps.ver.outputs.go }}
        with:
          release: "15.1"
          envs: GO_VERSION WASM2GO_VERSION
          prepare: |
            pkg install -y git
            # The synced workspace keeps the runner's uid; let root's git use it.
            git config --global --add safe.directory '*'
          run: |
            set -eu
            # Work from a cache outside the repo so tools that walk the tree
            # (gofmt in TestQualityGate) do not see the Go toolchain source;
            # move it back at the end so it is copied out and saved.
            CACHE=/var/tmp/ci-cache
            rm -rf "$CACHE"
            if [ -d .ci-cache ]; then mv .ci-cache "$CACHE"; else mkdir -p "$CACHE"; fi
            if [ ! -x "$CACHE/go/bin/go" ] || ! "$CACHE/go/bin/go" version | grep -q "go$GO_VERSION "; then
              rm -rf "$CACHE/go"
              fetch -o - "https://go.dev/dl/go$GO_VERSION.freebsd-amd64.tar.gz" | tar -xzf - -C "$CACHE"
            fi
            export PATH="$CACHE/go/bin:$CACHE/gopath/bin:$PATH"
            export GOPATH="$CACHE/gopath" GOCACHE="$CACHE/gocache" GOTOOLCHAIN=local
            export WASM2GO_RUN_CACHE_DIR="$CACHE/wasm2go-run"
            if [ ! -x "$CACHE/gopath/bin/wasm2go" ]; then
              go install "github.com/ncruces/wasm2go@$WASM2GO_VERSION"
            fi
            go version
            go build ./...
            go test -tags=e2e ./... -timeout 30m
            # Keep only the host-independent transpile cache.
            rm -rf "$WASM2GO_RUN_CACHE_DIR/build"
            mv "$CACHE" .ci-cache

  # Tier-2: ubuntu-24.04-{riscv,s390x,ppc64le-p10} need GitHub larger runners.
  # Default off so workflows do not queue forever. Enable: repo variable
  # CI_LINUX_OTHER_ARCH=true, under Settings, then Secrets and variables, then Actions.
  test-linux-other:
    if: vars.CI_LINUX_OTHER_ARCH == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-24.04-riscv
          - ubuntu-24.04-s390x
          - ubuntu-24.04-ppc64le-p10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure caches
        id: caches
        shell: bash
        run: |
          echo "testsuite=$(git rev-parse HEAD:wasi-testsuite)" >> "$GITHUB_OUTPUT"
          echo "GOBIN=$RUNNER_TEMP/gobin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
          echo "WASM2GO_RUN_CACHE_DIR=$RUNNER_TEMP/wasm2go-run" >> "$GITHUB_ENV"

      - name: Cache wasm2go binary
        id: wasm2go-bin
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gobin
          key: wasm2go-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.WASM2GO_VERSION }}-${{ hashFiles('go.mod') }}

      # Tier-1 wasm2go-run cache: transpiled Go for each testsuite binary. Its
      # entries are keyed by wasm content and wasm2go identity, so they only
      # change with the submodule pin or the wasm2go version. The tier-2
      # (compiled runner) cache depends on host source and is not kept.
      - name: Cache transpiled testsuite modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/wasm2go-run/transpile
          key: wasm2go-transpile-${{ runner.os }}-${{ env.WASM2GO_VERSION }}-${{ steps.caches.outputs.testsuite }}

      - name: Install wasm2go
        if: steps.wasm2go-bin.outputs.cache-hit != 'true'
        run: go install github.com/ncruces/wasm2go@${{ env.WASM2GO_VERSION }}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -tags=e2e ./... -timeout 15m

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Generate Changelog
        id: changelog
        run: |
          git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > /tmp/changelog.txt || echo "Initial release" > /tmp/changelog.txt
          cat /tmp/changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
